
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes API client for creating and managing notes.">
    <title>QuickNotes | Notes Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>QuickNotes</h1>
            <p>Your simple space for notes.</p>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Your notes</h2>
            <p>Load notes from the practice API or create a new note.</p>

            <button id="load-btn" type="button">Load notes</button>

            <p id="status" role="status" aria-live="polite">
                Ready to load notes.
            </p>

            <ul id="notes-list"></ul>
        </section>

        <section class="panel">
            <h2>Create a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note title (required)</label>
                    <input
                        id="title-input"
                        name="title"
                        type="text"
                        maxlength="100"
                        required
                        placeholder="Enter a note title"
                    >
                </div>

                <div class="form-group">
                    <label for="body-input">Note body (optional)</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="5"
                        placeholder="Write your note here..."
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">Create note</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>QuickNotes API Client · Learning project</p>
    </footer>
</body>
</html>
